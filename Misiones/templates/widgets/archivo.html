<div class="archivo-campo">
    <input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
    {% if widget.is_initial and not widget.required %}
        <label class="quitar-archivo" for="{{ widget.checkbox_id }}">
            <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"> Quitar imagen actual
        </label>
    {% endif %}
</div>
