<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>

{% if messages %}
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const estilos = {
                error: { icono: 'error', titulo: '¡Ups!', boton: 'g-btn rojo' },
                success: { icono: 'success', titulo: '¡Lo lograste!', boton: 'g-btn' },
                warning: { icono: 'warning', titulo: '¡Espera!', boton: 'g-btn oro' },
                info: { icono: 'info', titulo: 'Para que sepas', boton: 'g-btn azul' },
            };
            const cola = [
                {% for message in messages %}{ tag: "{{ message.tags|escapejs }}", texto: "{{ message|escapejs }}" },{% endfor %}
            ];
            (async () => {
                for (const m of cola) {
                    const clave = Object.keys(estilos).find(k => m.tag.includes(k)) || 'info';
                    const e = estilos[clave];
                    if (clave === 'success' && window.NLSonido) window.NLSonido.play('exito');
                    if (clave === 'error' && window.NLSonido) window.NLSonido.play('error');
                    await Swal.fire({
                        title: e.titulo,
                        text: m.texto,
                        icon: e.icono,
                        timer: 5000,
                        timerProgressBar: true,
                        buttonsStyling: false,
                        confirmButtonText: 'Continuar',
                        customClass: { popup: 'swal-juego', confirmButton: e.boton },
                    });
                }
            })();
        });
    </script>
{% endif %}
