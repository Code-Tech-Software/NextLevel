{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}Next-Level{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'css/alumno.css' %}">

    <link rel="manifest" href="{% url 'manifest.json' %}">
    <link rel="icon" type="image/png" href="{% static 'img/192x192.png' %}">
    <meta name="theme-color" content="#142c45">
    {% block extra_css %}{% endblock %}
</head>
<body class="juego {% block body_class %}{% endblock %}" {% block body_attrs %}{% endblock %}>
{% csrf_token %}

{% block cuerpo %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="{% static 'js/alumno.js' %}"></script>
{% include 'includes/alertas.html' %}
{% block extra_js %}{% endblock %}
</body>
</html>
